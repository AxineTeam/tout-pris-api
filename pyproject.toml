[project]
name = "tout-pris-back"
version = "0.1.0"
description = "Tout Pris backend API"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18",
    "drf-spectacular>=0.30",
    "django-extensions>=4.1",
    "dj-database-url>=3.0",
    "gunicorn>=23.0",
    "brevo-python>=5",
    "httpx>=0.27",
    "drf-pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "werkzeug>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tout_pris*", "accounts*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tout_pris.settings"
testpaths = ["tests"]
addopts = "--cov=tout_pris --cov=accounts --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

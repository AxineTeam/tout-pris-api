        position:
          type: integer
          readOnly: true
          description: Rank in the trip, taken from the kit at instantiation and editable
            afterwards.
        kits:
          type: array
          items:
            $ref: '#/components/schemas/Kit'
          readOnly: true
      required:
      - id
      - item_type
      - kits
      - person
      - position
      - status
    TripItemCreate:
      type: object
      properties:
        item_type:
          type: integer
        person:
          type: integer
          nullable: true
        quantity:
          type: integer
          maximum: 32767
          minimum: 1
          description: How many of the thing to pack, such as five t-shirts.
        status:
          type: integer
        note:
          type: string
          description: Free reminder shown on the line, such as the warm one.
          maxLength: 200
      required:
      - item_type
    TripParticipant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        person:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
      required:
      - id
      - person
    TripParticipantCreate:
      type: object
      properties:
        person:
          type: integer
      required:
      - person
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

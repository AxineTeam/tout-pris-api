openapi: 3.0.3
info:
  title: Tout Pris API
  version: 0.1.0
  description: Backend API of the Tout Pris project.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Health check
      tags:
      - monitoring
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/households/:
    get:
      operationId: households_list
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Household'
          description: ''
    post:
      operationId: households_create
      tags:
      - households
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HouseholdCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HouseholdCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
  /api/households/{household_id}/:
    patch:
      operationId: households_partial_update
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHouseholdUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
    delete:
      operationId: households_destroy
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/households/{household_id}/invitations/:
    get:
      operationId: households_invitations_list
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
    post:
      operationId: households_invitations_create
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/households/{household_id}/invitations/{id}/:
    delete:
      operationId: households_invitations_destroy
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/households/{household_id}/members/:
    get:
      operationId: households_members_list
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/households/{household_id}/members/{id}/:
    delete:
      operationId: households_members_destroy
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/households/{household_id}/persons/:
    get:
      operationId: households_persons_list
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
          description: ''
    post:
      operationId: households_persons_create
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      tags:
      - households
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
  /api/households/{household_id}/persons/{id}/:
    get:
      operationId: households_persons_retrieve
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
    patch:
      operationId: households_persons_partial_update
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - households
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPersonUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPersonUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
    delete:
      operationId: households_persons_destroy
      parameters:
      - in: path
        name: household_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invitations/accept/:
    post:
      operationId: invitations_accept_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
          description: ''
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Household:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
        personal:
          type: boolean
          readOnly: true
      required:
      - id
      - name
      - personal
    HouseholdCreate:
      type: object
      properties:
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
      required:
      - name
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          description: Address the invitation was sent to, which may or may not have
            an account.
          maxLength: 254
        person:
          type: integer
          nullable: true
          description: Person the guest is expected to be, so accepting fills that
            person in.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the invitation was created and its email sent.
        expires_at:
          type: string
          format: date-time
          description: When the token stops being accepted, a week after it was created.
      required:
      - created_at
      - email
      - expires_at
      - id
    InvitationAccept:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    InvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Address the invitation was sent to, which may or may not have
            an account.
          maxLength: 254
        person:
          type: integer
          nullable: true
          description: Person the guest is expected to be, so accepting fills that
            person in.
      required:
      - email
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          description: Account granted access to the household, its people, its catalog
            and its trips.
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          description: |-
            Reserved for a later differentiation of rights: every member can do everything.

            * `owner` - Owner
            * `member` - Member
      required:
      - email
      - id
      - role
      - user
    PatchedHouseholdUpdate:
      type: object
      properties:
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
    PatchedPersonUpdate:
      type: object
      properties:
        name:
          type: string
          description: Display name shown in every picker asking who an item is for.
          maxLength: 100
    Person:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Display name shown in every picker asking who an item is for.
          maxLength: 100
        user:
          type: integer
          readOnly: true
          nullable: true
          description: Account of the person when they have one, empty for a child
            or a guest.
      required:
      - id
      - name
      - user
    PersonCreate:
      type: object
      properties:
        name:
          type: string
          description: Display name shown in every picker asking who an item is for.
          maxLength: 100
      required:
      - name
    RoleEnum:
      enum:
      - owner
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `member` - Member
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

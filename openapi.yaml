components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
          description: Git ref the running image was built from, the tag on a release
            and the branch otherwise.
        commit:
          type: string
          nullable: true
          description: Short commit the running image was built from. Null unless
            the caller is an administrator.
      required:
      - commit
      - status
      - version
    Household:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
        personal:
          type: boolean
          readOnly: true
      required:
      - id
      - name
      - personal
    HouseholdCreate:
      type: object
      properties:
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
      required:
      - name
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          description: Address the invitation was sent to, which may or may not have
            an account.
          maxLength: 254
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the invitation was created and its email sent.
        expires_at:
          type: string
          format: date-time
          description: When the token stops being accepted, a week after it was created.
      required:
      - created_at
      - email
      - expires_at
      - id
    InvitationAccept:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    InvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Address the invitation was sent to, which may or may not have
            an account.
          maxLength: 254
      required:
      - email
    ItemStatus:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Wording shown on a line, such as taken out of the closet.
          maxLength: 100
        color:
          type: string
          description: 'Hexadecimal color the clients paint the status with, such
            as #f59e0b.'
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        progress:
          allOf:
          - $ref: '#/components/schemas/ProgressEnum'
          description: |-
            What the status counts as in the progress bar of a trip.

            * `not_started` - Not started
            * `in_progress` - In progress
            * `done` - Done
        position:
          type: integer
          readOnly: true
          description: Rank in the household status list.
        is_default:
          type: boolean
          description: Whether a new line gets this status, true for one status of
            the household.
      required:
      - color
      - id
      - name
      - position
    ItemStatusCreate:
      type: object
      properties:
        name:
          type: string
          description: Wording shown on a line, such as taken out of the closet.
          maxLength: 100
        color:
          type: string
          default: '#7b8189'
          description: 'Hexadecimal color the clients paint the status with, such
            as #f59e0b.'
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        progress:
          allOf:
          - $ref: '#/components/schemas/ProgressEnum'
          description: |-
            What the status counts as in the progress bar of a trip.

            * `not_started` - Not started
            * `in_progress` - In progress
            * `done` - Done
      required:
      - name
    ItemType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: What the thing is called when picking it, such as bib or sandals.
          maxLength: 100
        description:
          type: string
          description: Optional details telling apart two entries that share a name.
      required:
      - id
      - name
    ItemTypeCreate:
      type: object
      properties:
        name:
          type: string
          description: What the thing is called when picking it, such as bib or sandals.
          maxLength: 100
        description:
          type: string
          description: Optional details telling apart two entries that share a name.
      required:
      - name
    Kit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: What the block is called, such as diaper bag or hiking gear.
          maxLength: 100
        description:
          type: string
          description: Optional reminder of what the block is meant to cover.
        position:
          type: integer
          readOnly: true
          description: Rank of the section the kit displays as in a trip.
      required:
      - id
      - name
      - position
    KitCreate:
      type: object
      properties:
        name:
          type: string
          description: What the block is called, such as diaper bag or hiking gear.
          maxLength: 100
        description:
          type: string
          description: Optional reminder of what the block is meant to cover.
      required:
      - name
    KitDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: What the block is called, such as diaper bag or hiking gear.
          maxLength: 100
        description:
          type: string
          description: Optional reminder of what the block is meant to cover.
        position:
          type: integer
          readOnly: true
          description: Rank of the section the kit displays as in a trip.
        items:
          type: array
          items:
            $ref: '#/components/schemas/KitItem'
          readOnly: true
      required:
      - id
      - items
      - name
      - position
    KitInstantiation:
      type: object
      properties:
        kit:
          type: integer
      required:
      - kit
    KitItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        item_type:
          allOf:
          - $ref: '#/components/schemas/ItemType'
          readOnly: true
        person:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
          nullable: true
        quantity:
          type: integer
          maximum: 32767
          minimum: 1
          description: How many of the thing the block asks for, such as five t-shirts.
        note:
          type: string
          description: Free reminder carried to the trip, such as the warm one.
          maxLength: 200
        position:
          type: integer
          readOnly: true
          description: Rank in the block, which is the preparation order and follows
            into a trip.
      required:
      - id
      - item_type
      - person
      - position
    KitItemCreate:
      type: object
      properties:
        item_type:
          type: integer
        person:
          type: integer
          nullable: true
        quantity:
          type: integer
          maximum: 32767
          minimum: 1
          description: How many of the thing the block asks for, such as five t-shirts.
        note:
          type: string
          description: Free reminder carried to the trip, such as the warm one.
          maxLength: 200
      required:
      - item_type
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          description: Account granted access to the household, its people, its catalog
            and its trips.
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          description: |-
            An owner invites, removes a member, renames and deletes the household; a member does the rest.

            * `owner` - Owner
            * `member` - Member
      required:
      - email
      - id
      - role
      - user
    PatchedHouseholdUpdate:
      type: object
      properties:
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
    PatchedItemStatusUpdate:
      type: object
      description: A position moves the entry to that rank, the rest of its group
        shifting to make room.
      properties:
        name:
          type: string
          description: Wording shown on a line, such as taken out of the closet.

openapi: 3.0.3
info:
  title: Tout Pris API
  version: 0.1.0
  description: Backend API of the Tout Pris project.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Health check
      tags:
      - monitoring
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/households/:
    get:
      operationId: households_list
      tags:
      - households
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Household'
          description: ''
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Household:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Display name given by the members, such as their family name.
          maxLength: 100
        personal:
          type: boolean
          readOnly: true
      required:
      - id
      - name
      - personal
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest

      - run: uv run python manage.py check

      - run: uv run python manage.py makemigrations --check --dry-run

      - name: Django deployment checks
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-long-enough-to-satisfy-the-deployment-checks
          DJANGO_ALLOWED_HOSTS: tout-pris.example
          BREVO_API_KEY: ci-only-brevo-key

      - run: uv run python manage.py spectacular --file openapi.yaml

      - run: git diff --exit-code openapi.yaml

      - name: Schema diagram is up to date
        run: |
          uv run python manage.py graph_models accounts households catalog --no-inheritance --exclude-models "Abstract*,OrderedModelBase" | grep -v '// Created:' > docs/model/schema.dot
          git diff --exit-code docs/model/schema.dot

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  release-docker:
    name: Build & Push Docker image
    needs: [lint-and-test, build-image]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tout-pris-back
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Version the image answers with
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
